name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - .slsa-goreleaser.yml
          - .slsa-goreleaser-darwin-amd64.yml
          - .slsa-goreleaser-darwin-arm64.yml
    permissions:
      id-token: write    # for OIDC provenance signing
      contents: write    # required by slsa-github-generator
      actions: read      # for slsa-github-generator
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.0.0
    with:
      go-version: "1.26.4"
      config-file: ${{ matrix.config }}
      upload-assets: false   # we handle the release ourselves below

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries and provenance
        uses: actions/download-artifact@v4
        with:
          pattern: vigiles*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            vigiles \
            vigiles.intoto.jsonl \
            vigiles-darwin-amd64 \
            vigiles-darwin-amd64.intoto.jsonl \
            vigiles-darwin-arm64 \
            vigiles-darwin-arm64.intoto.jsonl \
            --repo "$RELEASE_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --verify-tag --generate-notes "${args[@]}"
